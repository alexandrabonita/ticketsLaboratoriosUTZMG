<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Control Lab B{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3 mb-4">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-cpu"></i> Control Laboratorios</a>
  </nav>

  <main class="container">
    {% block content %}
    <div class="p-4 bg-white rounded shadow-sm text-center">
      <h2 class="h4">Sistema Inicializado</h2>
      <p class="text-muted">Listo para configurar el escáner QR y el padrón de equipos.</p>
    </div>
    {% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
